<!DOCTYPE html>
<html lang="en">
<head>
  <title>Example #1</title>
</head>
<body>

<sdps-table id="cars-overview">
  <sdps-table-header-row>
    <sdps-table-header>Car Name</sdps-table-header>
    <sdps-table-header>Horse Powers</sdps-table-header>
    <sdps-table-header>Manufacture Year</sdps-table-header>
  </sdps-table-header-row>
  <sdps-table-row>
    <sdps-table-cell>Audi S5</sdps-table-cell>
    <sdps-table-cell>332</sdps-table-cell>
    <sdps-table-cell>2015</sdps-table-cell>
  </sdps-table-row>
  <sdps-table-row class='empty-row'></sdps-table-row>
  <sdps-table-row>
    <sdps-table-cell>Alfa Romeo Giulia</sdps-table-cell>
    <sdps-table-cell>500</sdps-table-cell>
    <sdps-table-cell>2020</sdps-table-cell>
  </sdps-table-row>
  <sdps-table-row>
    <sdps-table-cell>BMW X3</sdps-table-cell>
    <sdps-table-cell>215</sdps-table-cell>
    <sdps-table-cell>2017</sdps-table-cell>
  </sdps-table-row>
  <sdps-table-row>
    <sdps-table-cell>Skoda Octavia</sdps-table-cell>
    <sdps-table-cell>120</sdps-table-cell>
    <sdps-table-cell>2012</sdps-table-cell>
  </sdps-table-row>
  <sdps-table-row class='empty-row'>
    <sdps-table-cell></sdps-table-cell>
  </sdps-table-row>
</sdps-table>

</body>
</html>
